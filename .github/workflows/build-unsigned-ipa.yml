name: Build unsigned iPhone IPA

on:
  push:
    branches:
      - feat/cantonese-qwen3-offline-mvp
      - fix/ios-keyboard-haptics-caps-20261102
      - feat/live-yale-haptics-diagnostics-20261102
      - fix/haptic-core-canto-ime-20261102
      - feat/fixed-keyboard-settings-20261102
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: altboard-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unsigned iOS development build
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode 26.2
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Install build utilities
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          if ! command -v swiftlint >/dev/null; then brew install swiftlint; fi

      - name: Bootstrap llama.cpp framework
        run: |
          set -euo pipefail
          bash scripts/bootstrap-llama.sh

      - name: Generate offline Jyutping lexicon
        run: |
          set -euo pipefail
          python3 scripts/build-jyutping-lexicon.py
          test -s JyutpingResources/jyutping.sqlite3
          python3 -m unittest discover -s scripts -p 'test_jyutping_*.py'
          # impactOccurred(intensity:) may silently fail in the extension sandbox.
          if grep -E '^      generator[.]impactOccurred[(]intensity:' Shared/KeyboardHaptics.swift; then
            echo 'ERROR: use parameterless UIKit impactOccurred() in keyboard'
            exit 1
          fi
          swiftc -typecheck Shared/JyutpingComposition.swift Shared/SentenceCapitalization.swift Shared/LiveCantoneseSafety.swift Shared/CantoneseSyllableEditing.swift Shared/EnglishCaseSuggestion.swift
          swiftc -o "$RUNNER_TEMP/keyboard-smoke" \
            Shared/JyutpingComposition.swift Shared/SentenceCapitalization.swift \
            Shared/LiveCantoneseSafety.swift Shared/CantoneseSyllableEditing.swift Shared/EnglishCaseSuggestion.swift \
            scripts/verify-keyboard-core.swift
          "$RUNNER_TEMP/keyboard-smoke"
          swiftc -o "$RUNNER_TEMP/layout-smoke" \
            Shared/KeyboardKind.swift Shared/KeyboardLayoutGeometry.swift \
            scripts/verify-keyboard-layout.swift
          "$RUNNER_TEMP/layout-smoke"
          if grep -R -n -E '[.]keyboardHeightScale|SharedKey[.]keyboardHeightScale' \
              --include='*.swift' Sayboard SayboardKeyboard Shared; then
            echo 'ERROR: active code still references the removed height preference'
            exit 1
          fi
          if grep -q 'Slider(value: self.\$heightScale' Sayboard/Views/KeyboardSettingsView.swift; then
            echo 'ERROR: legacy height slider is still exposed'
            exit 1
          fi

      - name: Stamp matching build SHA into app and keyboard
        shell: bash
        run: |
          set -euo pipefail
          for plist in Sayboard/Info.plist SayboardKeyboard/Info.plist; do
            /usr/libexec/PlistBuddy -c "Add :AltboardBuildSHA string $GITHUB_SHA" "$plist" ||
              /usr/libexec/PlistBuddy -c "Set :AltboardBuildSHA $GITHUB_SHA" "$plist"
          done

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Compile for physical iPhone without code signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Sayboard.xcodeproj \
            -scheme Sayboard \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/AltboardDerived" \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            'CODE_SIGN_IDENTITY=' \
            'DEVELOPMENT_TEAM=' \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Preserve App Group entitlements for SideStore
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/AltboardDerived/Build/Products/Release-iphoneos/Sayboard.app"
          test -d "$APP/PlugIns" || exit 1
          test -s "$APP/PlugIns/SayboardKeyboard.appex/jyutping.sqlite3" || {
            echo 'ERROR: offline Jyutping lexicon missing from keyboard extension'
            exit 1
          }

          # No developer credential is needed. These ad-hoc signatures only
          # carry capability requests for SideStore to re-sign on the device.
          for dir in "$APP/Frameworks" "$APP/PlugIns/SayboardKeyboard.appex/Frameworks"; do
            if [ -d "$dir" ]; then
              for item in "$dir"/*; do
                [ -e "$item" ] || continue
                case "$item" in
                  *.framework|*.dylib) codesign --force --sign - --timestamp=none "$item" ;;
                esac
              done
            fi
          done

          for extension in "$APP"/PlugIns/*.appex; do
            test -d "$extension" || exit 1
            codesign --force --sign - --timestamp=none \
              --entitlements "$GITHUB_WORKSPACE/SayboardKeyboard/SayboardKeyboard.entitlements" \
              "$extension"
            codesign -d --entitlements - "$extension" > "$RUNNER_TEMP/keyboard-entitlements.plist" 2>/dev/null
            grep -Fq 'group.app.sayboard.shared' "$RUNNER_TEMP/keyboard-entitlements.plist" || exit 1
          done

          codesign --force --sign - --timestamp=none \
            --entitlements "$GITHUB_WORKSPACE/Sayboard/Sayboard.entitlements" "$APP"
          codesign -d --entitlements - "$APP" > "$RUNNER_TEMP/app-entitlements.plist" 2>/dev/null
          grep -Fq 'group.app.sayboard.shared' "$RUNNER_TEMP/app-entitlements.plist" || exit 1
          codesign --verify --deep --verbose=2 "$APP"
          echo 'App and keyboard both request the same App Group'

      - name: Package IPA for SideStore with keyboard extension
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/AltboardDerived/Build/Products/Release-iphoneos/Sayboard.app"
          test -d "$APP" || { echo 'ERROR: Sayboard.app not found'; exit 1; }
          test -d "$APP/PlugIns" || { echo 'ERROR: keyboard extension not found'; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipa/Payload" "$GITHUB_WORKSPACE/dist"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -q -r "$GITHUB_WORKSPACE/dist/Altboard-Canto-SideStore.ipa" Payload)
          unzip -t "$GITHUB_WORKSPACE/dist/Altboard-Canto-SideStore.ipa" | tail -n 1
          ls -lh "$GITHUB_WORKSPACE/dist/Altboard-Canto-SideStore.ipa"

      - name: Upload IPA to this Actions run
        uses: actions/upload-artifact@v7
        with:
          name: Altboard-Canto-Unsigned-IPA
          path: dist/Altboard-Canto-SideStore.ipa
          archive: false
          if-no-files-found: error
          retention-days: 14

      # Artifact v7 with archive:false downloads the .ipa directly.
      # Also publish the same .ipa as a Release asset for a stable direct URL.
      - name: Publish direct IPA to rolling development release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="altboard-canto-dev"
          if [ "$GITHUB_REF_NAME" = "feat/fixed-keyboard-settings-20261102" ]; then
            TAG="altboard-canto-fixed-preview"
          fi
          IPA="dist/Altboard-Canto-SideStore.ipa"
          test -s "$IPA"
          NOTES="Unsigned SideStore IPA built from commit $GITHUB_SHA on branch $GITHUB_REF_NAME. Install using SideStore, which must re-sign the IPA."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create "$TAG" "$IPA" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Altboard-Canto development IPA" \
              --notes "$NOTES" \
              --prerelease
          fi
          # Keep the release tag and its download tied to the latest built SHA.
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
            -f "sha=$GITHUB_SHA" -F "force=true" >/dev/null
          DIRECT="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Altboard-Canto-SideStore.ipa"
          echo "### Direct IPA download" >> "$GITHUB_STEP_SUMMARY"
          echo "[$DIRECT]($DIRECT)" >> "$GITHUB_STEP_SUMMARY"
          echo "Built from commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
