name: Build unsigned iPhone IPA

# Single unsigned IPA workflow. All development and automatic IPA builds use main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: altboard-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unsigned iOS development build
    # Manual dispatch from archival feature branches must not create a second IPA.
    if: github.ref == 'refs/heads/main'
    # macOS 15 ARM64 jobs #52/#54 cancelled before executing a step (0ms billed).
    # The Intel image also carries Xcode 26.2; use this alternate hosted pool.
    runs-on: macos-15-intel
    timeout-minutes: 55
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode 26.2
        run: |
          set -euo pipefail
          # macos-26 jobs stalled for 15 minutes with zero executed steps.
          # macos-15 is generally available; select Xcode 26.2 if installed.
          XCODE="/Applications/Xcode_26.2.app/Contents/Developer"
          if [ ! -d "$XCODE" ]; then
            echo "ERROR: Xcode 26.2 unavailable on this runner"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi

      - name: Validate keyboard document identity bridge
        run: |
          set -euo pipefail
          swiftc -o "$RUNNER_TEMP/document-identity-smoke" \
            Shared/KeyboardDocumentIdentifier.swift scripts/verify-keyboard-document-identifier.swift
          "$RUNNER_TEMP/document-identity-smoke"

      - name: Verify audio FIFO and bounded compaction
        run: |
          set -euo pipefail
          swiftc -swift-version 6 -o "$RUNNER_TEMP/audio-sample-queue-smoke" \
            Sayboard/Services/AudioSampleQueue.swift scripts/verify-audio-sample-queue.swift
          "$RUNNER_TEMP/audio-sample-queue-smoke"
          swiftc -swift-version 6 -o "$RUNNER_TEMP/recording-policies-smoke" \
            Shared/DictationRequestPolicy.swift Sayboard/Services/AudioWaveformPeaks.swift \
            scripts/verify-recording-policies.swift
          "$RUNNER_TEMP/recording-policies-smoke"

      - name: Verify keyboard lifecycle timing and incomplete callbacks
        run: |
          set -euo pipefail
          swiftc -swift-version 6 -o "$RUNNER_TEMP/lifecycle-timing-smoke" \
            Shared/KeyboardLifecycleTiming.swift scripts/verify-keyboard-lifecycle-timing.swift
          "$RUNNER_TEMP/lifecycle-timing-smoke"

      - name: Bootstrap llama.cpp framework
        run: |
          set -euo pipefail
          bash scripts/bootstrap-llama.sh

      - name: Generate offline Cantonese IME (Jyutping source + Yale/Sidney Lau indexes)
        run: |
          set -euo pipefail
          python3 scripts/build-jyutping-lexicon.py
          python3 scripts/build-cantonese-ngrams.py
          python3 scripts/build-informal-ngrams.py
          python3 scripts/build-chinese-shapes.py
          python3 scripts/build-emoji-catalog.py
          test -s EmojiResources/emoji_catalog.tsv
          test -s EmojiResources/UnicodeLicense.txt
          test -s JyutpingResources/jyutping.sqlite3
          test -s JyutpingResources/chinese-shapes.sqlite3
          test -s JyutpingResources/RimeStrokeLicense.txt
          test -s JyutpingResources/RimeStrokeGPLv3.txt
          test -s JyutpingResources/RimeStrokeNotice.txt
          python3 -m unittest discover -s scripts -p 'test_chinese_shapes.py'
          python3 -m unittest discover -s scripts -p 'test_jyutping_*.py'
          python3 -m unittest discover -s scripts -p 'test_universal_cantonese.py'
          python3 -m unittest discover -s scripts -p 'test_cantonese_ngrams.py'
          python3 -m unittest discover -s scripts -p 'test_informal_ngrams.py'
          python3 -m unittest discover -s scripts -p 'test_hk_japanese_lexicon.py'
          # Regression for blank keycap rows seen on physical iPhone.
          python3 -m unittest discover -s scripts -p 'test_symbol_visibility.py'
          python3 -m unittest discover -s scripts -p 'test_keyboard_initial_layout.py'
          python3 -m unittest discover -s scripts -p 'test_keyboard_safety_contract.py'
          python3 -m unittest discover -s scripts -p 'test_emoji_catalog.py'
          python3 -m unittest discover -s scripts -p 'test_ipa_bundle.py'
          swiftc -o "$RUNNER_TEMP/punctuation-smoke" \
            Shared/ChinesePunctuationPolicy.swift scripts/verify-chinese-punctuation.swift
          "$RUNNER_TEMP/punctuation-smoke"
          swiftc -o "$RUNNER_TEMP/scheme-smoke" \
            Shared/CantoneseSyllableEditing.swift Shared/CantoneseSchemePreference.swift \
            scripts/verify-scheme-preference.swift
          "$RUNNER_TEMP/scheme-smoke"
          # impactOccurred(intensity:) may silently fail in the extension sandbox.
          if grep -E '^      generator[.]impactOccurred[(]intensity:' Shared/KeyboardHaptics.swift; then
            echo 'ERROR: use parameterless UIKit impactOccurred() in keyboard'
            exit 1
          fi
          swiftc -typecheck Shared/JyutpingComposition.swift Shared/SentenceCapitalization.swift Shared/LiveCantoneseSafety.swift Shared/CantoneseSyllableEditing.swift Shared/EnglishCaseSuggestion.swift
          swiftc -o "$RUNNER_TEMP/universal-canto-smoke" \
            Shared/CantoneseRomanizationVariants.swift Shared/CantoneseSyllableEditing.swift \
            scripts/verify-universal-cantonese.swift
          "$RUNNER_TEMP/universal-canto-smoke"
          swiftc -o "$RUNNER_TEMP/cantonese-ngram-smoke" \
            Shared/CantoneseNgramDecoder.swift scripts/verify-cantonese-ngram.swift
          "$RUNNER_TEMP/cantonese-ngram-smoke"
          swiftc -o "$RUNNER_TEMP/informal-ngram-smoke" \
            Shared/InformalNgramPolicy.swift scripts/verify-informal-ngram.swift
          "$RUNNER_TEMP/informal-ngram-smoke"
          swiftc -o "$RUNNER_TEMP/microphone-press-smoke" \
            Shared/MicrophonePressPolicy.swift scripts/verify-microphone-press.swift
          "$RUNNER_TEMP/microphone-press-smoke"
          swiftc -o "$RUNNER_TEMP/voice-output-routing-smoke" \
            Shared/VoiceOutputSelectionPolicy.swift scripts/verify-voice-output-selection.swift
          "$RUNNER_TEMP/voice-output-routing-smoke"
          swiftc -o "$RUNNER_TEMP/voice-punctuation-smoke" \
            Shared/VoicePunctuationPolicy.swift scripts/verify-voice-punctuation.swift
          "$RUNNER_TEMP/voice-punctuation-smoke"
          swiftc -o "$RUNNER_TEMP/voice-script-smoke" \
            Shared/VoiceOutputScriptPolicy.swift scripts/verify-voice-script.swift
          "$RUNNER_TEMP/voice-script-smoke"
          swiftc -o "$RUNNER_TEMP/live-dictation-notice-smoke" \
            Shared/LiveDictationNotice.swift scripts/verify-live-dictation-notice.swift
          "$RUNNER_TEMP/live-dictation-notice-smoke"
          swiftc -o "$RUNNER_TEMP/llm-bridge-smoke" \
            Shared/LLMBridge.swift scripts/verify-llm-bridge.swift
          "$RUNNER_TEMP/llm-bridge-smoke"
          swiftc -o "$RUNNER_TEMP/llm-device-policy-smoke" \
            Shared/LLMDevicePolicy.swift Sayboard/Services/LLMPromptTemplates.swift \
            scripts/verify-llm-device-policy.swift
          "$RUNNER_TEMP/llm-device-policy-smoke"
          swiftc -o "$RUNNER_TEMP/language-priority-smoke" \
            Shared/LanguagePriority.swift scripts/verify-language-priority.swift
          "$RUNNER_TEMP/language-priority-smoke"
          swiftc -o "$RUNNER_TEMP/vocabulary-export-smoke" \
            Shared/PersonalVocabularyExport.swift scripts/verify-vocabulary-export.swift
          "$RUNNER_TEMP/vocabulary-export-smoke"
          swiftc -o "$RUNNER_TEMP/confirmed-choice-smoke" \
            Shared/ChineseInputMode.swift Shared/ConfirmedChoiceLearning.swift \
            scripts/verify-confirmed-choice-learning.swift
          "$RUNNER_TEMP/confirmed-choice-smoke"
          swiftc -o "$RUNNER_TEMP/latin-speech-learning-smoke" \
            Shared/HistoryRecord.swift Shared/LatinSpeechCorrectionLearning.swift \
            scripts/verify-latin-speech-learning.swift
          "$RUNNER_TEMP/latin-speech-learning-smoke"
          swiftc -o "$RUNNER_TEMP/keyboard-smoke" \
            Shared/JyutpingComposition.swift Shared/SentenceCapitalization.swift \
            Shared/LiveCantoneseSafety.swift Shared/CantoneseSyllableEditing.swift Shared/EnglishCaseSuggestion.swift \
            scripts/verify-keyboard-core.swift
          "$RUNNER_TEMP/keyboard-smoke"
          swiftc -o "$RUNNER_TEMP/latin-suggestions-smoke" \
            Shared/LanguagePriority.swift Shared/LatinWordSuggestionPolicy.swift scripts/verify-latin-suggestions.swift
          "$RUNNER_TEMP/latin-suggestions-smoke"
          swiftc -o "$RUNNER_TEMP/touch-smoke" \
            Shared/KeyTouchMap.swift scripts/verify-key-touch-map.swift
          "$RUNNER_TEMP/touch-smoke"
          swiftc -o "$RUNNER_TEMP/swipe-smoke" \
            Shared/KeyboardKind.swift SayboardKeyboard/LatinSwipeDecoder.swift \
            scripts/verify-latin-swipe.swift
          "$RUNNER_TEMP/swipe-smoke"
          swiftc -o "$RUNNER_TEMP/letter-hold-smoke"             Shared/LetterKeyAlternates.swift scripts/verify-letter-hold.swift
          "$RUNNER_TEMP/letter-hold-smoke"
          swiftc -o "$RUNNER_TEMP/cursor-line-smoke" \
            Shared/CursorLineNavigation.swift scripts/verify-cursor-navigation.swift
          "$RUNNER_TEMP/cursor-line-smoke"
          swiftc -o "$RUNNER_TEMP/chinese-input-smoke" \
            Shared/ChineseInputMode.swift scripts/verify-chinese-input.swift
          "$RUNNER_TEMP/chinese-input-smoke"
          python3 -m unittest discover -s scripts -p 'test_settings_contract.py'
          python3 -m unittest discover -s scripts -p 'test_interface_localizations.py'
          python3 scripts/check-app-structure.py --check
          python3 -m json.tool docs/ios-keyboard-reference.json >/dev/null
          python3 -m json.tool docs/ios-keyboard-native-vs-altboard-pixel-comparison.json >/dev/null
          python3 -m json.tool docs/swipe-typing-en-de-plan.json >/dev/null
          swiftc -o "$RUNNER_TEMP/keyboard-host-geometry-smoke" \
            Shared/KeyboardHostGeometry.swift scripts/verify-keyboard-host-geometry.swift
          "$RUNNER_TEMP/keyboard-host-geometry-smoke"
          swiftc -o "$RUNNER_TEMP/keyboard-handoff-smoke" \
            Shared/KeyboardHandoffAnalyzer.swift scripts/verify-keyboard-handoff.swift
          "$RUNNER_TEMP/keyboard-handoff-smoke"
          swiftc -o "$RUNNER_TEMP/layout-smoke" \
            Shared/KeyboardKind.swift Shared/KeyboardLayoutGeometry.swift \
            scripts/verify-keyboard-layout.swift
          "$RUNNER_TEMP/layout-smoke"
          if grep -R -n -F 'KeyboardEdgeDismissalCoordinator(' --include='*.swift' SayboardKeyboard; then
            echo 'ERROR: removed experimental top-edge gesture was reintroduced'
            exit 1
          fi
          if grep -R -n -E '[.]keyboardHeightScale|SharedKey[.]keyboardHeightScale' \
              --include='*.swift' Sayboard SayboardKeyboard Shared; then
            echo 'ERROR: active code still references the removed height preference'
            exit 1
          fi
          if grep -q 'Slider(value: self.\$heightScale' Sayboard/Views/KeyboardSettingsView.swift; then
            echo 'ERROR: legacy height slider is still exposed'
            exit 1
          fi

      # JBoard's MIT Swift implementation informed our decoder. The pinned
      # 82,834-entry frequency corpus has separate Google Books / SCOWL
      # attribution, preserved verbatim in the shipped third-party notices.
      - name: Stage pinned offline English swipe lexicon
        run: |
          set -euo pipefail
          mkdir -p SayboardKeyboard/Resources
          SOURCE="https://raw.githubusercontent.com/nkrsn/jboard/70b9d5af92ca4a6846db8bae18834c4cb1e2c510/Core/Resources"
          curl -fsSL --retry 3 "$SOURCE/english-frequency.txt"             -o SayboardKeyboard/Resources/english-frequency.txt
          curl -fsSL --retry 3 "$SOURCE/ThirdPartyNotices.txt"             -o SayboardKeyboard/Resources/ThirdPartyNotices.txt
          test "$(wc -c < SayboardKeyboard/Resources/english-frequency.txt | tr -d ' ')" -eq 1332879
          test -s SayboardKeyboard/Resources/ThirdPartyNotices.txt
          grep -q '^you ' SayboardKeyboard/Resources/english-frequency.txt
          grep -q '^not ' SayboardKeyboard/Resources/english-frequency.txt
          grep -q '^actually ' SayboardKeyboard/Resources/english-frequency.txt

      - name: Stamp matching build SHA into app and keyboard
        shell: bash
        run: |
          set -euo pipefail
          for plist in Sayboard/Info.plist SayboardKeyboard/Info.plist; do
            /usr/libexec/PlistBuddy -c "Add :AltboardBuildSHA string $GITHUB_SHA" "$plist" ||
              /usr/libexec/PlistBuddy -c "Set :AltboardBuildSHA $GITHUB_SHA" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$plist"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$GITHUB_RUN_NUMBER"
          done

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Compile for physical iPhone without code signing
        shell: bash
        run: |
          set -euo pipefail
          # The macOS runner's stale SwiftPM binary-artifact cache can prevent
          # package resolution before the compiler starts.
          ARTIFACT_CACHE="$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          rm -rf "$ARTIFACT_CACHE"
          build_iphone() {
            xcodebuild \
              -project Sayboard.xcodeproj \
              -scheme Sayboard \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$RUNNER_TEMP/AltboardDerived" \
              -jobs 2 \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              'CODE_SIGN_IDENTITY=' \
              'DEVELOPMENT_TEAM=' \
              build
          }
          if ! build_iphone 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"; then
            if grep -Fq 'Could not resolve package dependencies' "$RUNNER_TEMP/xcodebuild.log" &&
               grep -Fq 'already exists in file system' "$RUNNER_TEMP/xcodebuild.log"; then
              rm -rf "$ARTIFACT_CACHE"
              build_iphone 2>&1 | tee "$RUNNER_TEMP/xcodebuild-retry.log"
            else
              exit 1
            fi
          fi

      - name: Preserve App Group entitlements for SideStore
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/AltboardDerived/Build/Products/Release-iphoneos/Sayboard.app"
          test -d "$APP/PlugIns" || exit 1
          test -s "$APP/PlugIns/SayboardKeyboard.appex/jyutping.sqlite3" || {
            echo 'ERROR: offline Jyutping lexicon missing from keyboard extension'
            exit 1
          }
          test -s "$APP/PlugIns/SayboardKeyboard.appex/HKCanCorAttribution.txt" || {
            echo 'ERROR: required HKCanCor attribution missing from keyboard extension'
            exit 1
          }
          python3 -c "import sqlite3,sys; db=sqlite3.connect(sys.argv[1]); assert db.execute('SELECT count(*) FROM corpus_ngrams').fetchone()[0]>2000; assert db.execute('PRAGMA quick_check').fetchone()[0]=='ok'" \
            "$APP/PlugIns/SayboardKeyboard.appex/jyutping.sqlite3"
          python3 -c "import sqlite3,sys; db=sqlite3.connect(sys.argv[1]); assert db.execute('SELECT count(*) FROM informal_terms').fetchone()[0]>=60; assert db.execute('SELECT count(*) FROM informal_ngrams').fetchone()[0]>=150; assert db.execute('SELECT count(*) FROM curated_cantonese_ngrams').fetchone()[0]>=100; assert db.execute('SELECT count(*) FROM curated_cantonese_next').fetchone()[0]>=15; assert db.execute('SELECT count(*) FROM hk_japanese_lexicon').fetchone()[0]>=175; assert db.execute(\"SELECT romanization FROM hk_japanese_lexicon WHERE word='の'\").fetchone()[0]=='zi1'" \
            "$APP/PlugIns/SayboardKeyboard.appex/jyutping.sqlite3"
          test -s "$APP/PlugIns/SayboardKeyboard.appex/chinese-shapes.sqlite3" || {
            echo 'ERROR: offline Cangjie, Quick and Stroke lexicon missing'
            exit 1
          }
          for notice in RimeStrokeLicense.txt RimeStrokeGPLv3.txt RimeStrokeNotice.txt; do
            test -s "$APP/PlugIns/SayboardKeyboard.appex/$notice" || {
              echo "ERROR: required Rime Stroke attribution missing: $notice"
              exit 1
            }
          done
          test -s "$APP/PlugIns/SayboardKeyboard.appex/english-frequency.txt" || {
            echo 'ERROR: offline English swipe lexicon missing from keyboard extension'
            exit 1
          }
          test -s "$APP/PlugIns/SayboardKeyboard.appex/ThirdPartyNotices.txt" || {
            echo 'ERROR: required English lexicon attribution missing from keyboard extension'
            exit 1
          }
          test -s "$APP/PlugIns/SayboardKeyboard.appex/emoji_catalog.tsv" || {
            echo 'ERROR: offline Emoji catalog missing from keyboard extension'
            exit 1
          }
          test -s "$APP/PlugIns/SayboardKeyboard.appex/UnicodeLicense.txt" || {
            echo 'ERROR: Unicode Emoji license missing from keyboard extension'
            exit 1
          }

          # No developer credential is needed. These ad-hoc signatures only
          # carry capability requests for SideStore to re-sign on the device.
          for dir in "$APP/Frameworks" "$APP/PlugIns/SayboardKeyboard.appex/Frameworks"; do
            if [ -d "$dir" ]; then
              for item in "$dir"/*; do
                [ -e "$item" ] || continue
                case "$item" in
                  *.framework|*.dylib) codesign --force --sign - --timestamp=none "$item" ;;
                esac
              done
            fi
          done

          for extension in "$APP"/PlugIns/*.appex; do
            test -d "$extension" || exit 1
            codesign --force --sign - --timestamp=none \
              --entitlements "$GITHUB_WORKSPACE/SayboardKeyboard/SayboardKeyboard.entitlements" \
              "$extension"
            codesign -d --entitlements - "$extension" > "$RUNNER_TEMP/keyboard-entitlements.plist" 2>/dev/null
            grep -Fq 'group.app.sayboard.shared' "$RUNNER_TEMP/keyboard-entitlements.plist" || exit 1
          done

          codesign --force --sign - --timestamp=none \
            --entitlements "$GITHUB_WORKSPACE/Sayboard/Sayboard.entitlements" "$APP"
          codesign -d --entitlements - "$APP" > "$RUNNER_TEMP/app-entitlements.plist" 2>/dev/null
          grep -Fq 'group.app.sayboard.shared' "$RUNNER_TEMP/app-entitlements.plist" || exit 1
          codesign --verify --deep --verbose=2 "$APP"
          echo 'App and keyboard both request the same App Group'

      - name: Package IPA for SideStore with keyboard extension
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/AltboardDerived/Build/Products/Release-iphoneos/Sayboard.app"
          test -d "$APP" || { echo 'ERROR: Sayboard.app not found'; exit 1; }
          test -d "$APP/PlugIns" || { echo 'ERROR: keyboard extension not found'; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipa/Payload" "$GITHUB_WORKSPACE/dist"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -q -r "$GITHUB_WORKSPACE/dist/Altboard-Canto-SideStore.ipa" Payload)
          unzip -t "$GITHUB_WORKSPACE/dist/Altboard-Canto-SideStore.ipa" | tail -n 1
          ls -lh "$GITHUB_WORKSPACE/dist/Altboard-Canto-SideStore.ipa"

      - name: Verify the single physical-iPhone IPA artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-ipa-bundle.py \
            dist/Altboard-Canto-SideStore.ipa \
            --expected-sha "$GITHUB_SHA" \
            --expected-build-number "$GITHUB_RUN_NUMBER" \
            --expected-primary-language mul \
            --expect-emoji-catalog --expect-merged-shapes

      - name: Upload IPA to this Actions run
        uses: actions/upload-artifact@v7
        with:
          name: Altboard-Canto-Unsigned-IPA
          path: dist/Altboard-Canto-SideStore.ipa
          archive: false
          if-no-files-found: error
          retention-days: 14

      # Artifact v7 with archive:false downloads the .ipa directly.
      # Keep prior branch preview releases (including #68) untouched.
      # Only main publishes to its own stable development URL.
      - name: Publish direct IPA to rolling development release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="altboard-canto-main-dev"
          IPA="dist/Altboard-Canto-SideStore.ipa"
          test -s "$IPA"
          NOTES="Unsigned SideStore IPA built from commit $GITHUB_SHA on branch $GITHUB_REF_NAME. Install using SideStore, which must re-sign the IPA."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create "$TAG" "$IPA" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Altboard-Canto development IPA" \
              --notes "$NOTES" \
              --prerelease
          fi
          # Keep the release tag and its download tied to the latest built SHA.
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
            -f "sha=$GITHUB_SHA" -F "force=true" >/dev/null
          DIRECT="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Altboard-Canto-SideStore.ipa"
          echo "### Direct IPA download" >> "$GITHUB_STEP_SUMMARY"
          echo "[$DIRECT]($DIRECT)" >> "$GITHUB_STEP_SUMMARY"
          echo "Built from commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"




